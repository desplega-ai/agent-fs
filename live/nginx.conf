# Mirrors live/vercel.json: the SPA fallback skips /assets/, so a missing chunk is a 404, never index.html.

# Query strings can carry credentials, so the log line keeps the path only and drops the referrer.
map $request_uri $live_request_path {
    ~^(?<path>[^?]*) $path;
}
log_format live_noquery '$remote_addr [$time_local] "$request_method $live_request_path $server_protocol" $status $body_bytes_sent';

map $uri $live_cache_control {
    default         "no-cache";
    ~^/assets/      "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log live_noquery;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Locations below set no add_header, so they inherit all of these. Cache-Control has no
    # `always`: an asset 404 must not be cached as immutable during a rolling deploy.
    add_header Cache-Control $live_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.map$ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
