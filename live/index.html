<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- First in <head>, before anything fetches: the invite accept page holds a bearer token, and no
         request this app makes (assets included) may carry its address in Referer. -->
    <meta name="referrer" content="no-referrer" />
    <script>
      // Links issued before the fragment form carry the token in the path (/invite/<token>).
      // Move it into the tab's sessionStorage and out of the address bar before the app's first
      // asset request. Keep the storage key in step with TOKEN_STORAGE_KEY in src/lib/invites.ts.
      (function () {
        var match = /^\/invite\/([A-Za-z0-9_-]+)\/?$/.exec(location.pathname)
        if (!match) return
        try {
          sessionStorage.setItem("agent-fs-invite-token", match[1])
        } catch (e) {
          return // Storage blocked: leave the URL for the app, which reads it from there.
        }
        history.replaceState(history.state, "", "/invite" + location.search + location.hash)
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>agent-fs</title>
    <meta name="description" content="A sharable, searchable, persistent file system built for AI agents." />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="agent-fs" />
    <meta property="og:description" content="A sharable, searchable, persistent file system built for AI agents." />
    <meta property="og:site_name" content="agent-fs" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
