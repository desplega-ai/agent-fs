name: Deploy to Fly.io

on:
  push:
    branches: [main]

# One deploy at a time. A newer push waits for the running deploy.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A normal deploy takes about 3 minutes. On 2026-10-17 a hung machine
    # update kept this job busy for 98 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master, 2026-10-30

      - run: flyctl deploy --yes --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
