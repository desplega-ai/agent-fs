name: Deploy to Fly.io

on:
  push:
    branches: [main]

# One deploy at a time. A newer push waits for the running deploy.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A normal deploy takes about 3 minutes. On 2026-10-17 a hung machine
    # update kept this job busy for 98 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --yes --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
