name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs that need more set their own permissions.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # checks: read lets the last step read the PR Body check.
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      # Catches a partial version bump (root package.json moved but the
      # sub-packages, Cargo.toml, or plugin.json were left behind) on the PR
      # rather than at release time.
      - name: Version sync
        run: bun run scripts/sync-versions.ts --check
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
      - name: Coverage
        run: bun run test:coverage
      - name: OpenAPI spec freshness
        run: |
          bun run scripts/sync-openapi.ts
          git diff --exit-code docs/openapi.json
      # `ci` is a required check, so a red PR Body (pr-body.yml) blocks the
      # merge here. pr-body.yml re-runs this job after a description edit.
      # Skips on push and merge_group.
      - name: Require a green PR Body
        uses: desplega-ai/.github/actions/require-pr-body@aa9436df8f0ef570f033e78dc68d1ef052add22c

  # Credential-free CLI/API/MCP coverage. The local filesystem adapter keeps
  # this job fork-safe and Docker-free; MinIO presigned URLs stay covered by
  # the full local E2E mode, while FUSE has the dedicated smoke job below.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Run local-filesystem E2E suite
        run: bun run scripts/e2e.ts "bun run packages/cli/src/index.ts --" --local-only

  # FUSE smoke (Linux-only): build the helper, run the in-container mount test.
  # macOS/Windows runners are excluded — FUSE is Linux-only by design.
  fuse-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Test FUSE helper
        working-directory: packages/fuse-helper
        run: cargo test
      - name: Lint FUSE helper
        working-directory: packages/fuse-helper
        run: cargo clippy --all-targets -- -D warnings
      - name: Check FUSE helper formatting
        working-directory: packages/fuse-helper
        run: cargo fmt --check
      - name: Build FUSE helper (host target)
        run: |
          cd packages/fuse-helper
          cargo build --release
      - name: Run Docker FUSE smoke
        run: |
          # The harness builds a Ubuntu 24.04 image with fuse3 + /dev/fuse and
          # mounts the helper against a stub socket. Linux-only.
          bash packages/fuse-helper/docker/run-mount-test.sh

  # Phase 5 will extend this with `bun run scripts/e2e.ts ... --fuse-only`
  # once the e2e harness gains a --fuse-only flag. For Phase 4 the Docker
  # smoke above is the single FUSE regression check.

  # Live UI image: build it and check what nginx serves. On PRs it runs only when
  # its inputs change.
  live-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Detect live image changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(live/|Dockerfile\.live|package\.json$|scripts/smoke-live-image\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.changes.outputs.run == 'true'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.changes.outputs.run == 'true'
        with:
          context: .
          file: Dockerfile.live
          load: true
          tags: agent-fs-live:ci
          cache-from: type=gha,scope=live
      - name: Smoke test
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/smoke-live-image.sh agent-fs-live:ci

  # Server image + docker-compose.yml: the HEALTHCHECK passes, the published
  # port answers from the host, and a write lands in MinIO. On PRs it runs only
  # when its inputs change.
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Detect server image changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(Dockerfile$|docker/|docker-compose\.yml$|package\.json$|bun\.lock$|scripts/smoke-server-compose\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke test
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/smoke-server-compose.sh

  # Live UI tests: every unit test under live/src (the `ci` job covers only
  # live/src/lib, which needs no live dependencies) and the Playwright suite,
  # which runs against fixtures. On PRs it runs only when live/ changes.
  live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Detect live changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(live/|package\.json$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.changes.outputs.run == 'true'
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22'
      # live/src/lib/__tests__/share-url-server.test.ts imports packages/core.
      - name: Install root dependencies
        if: steps.changes.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Install live dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: live
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Unit tests
        if: steps.changes.outputs.run == 'true'
        working-directory: live
        run: bun test src/
      - name: Install Chromium
        if: steps.changes.outputs.run == 'true'
        working-directory: live
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        if: steps.changes.outputs.run == 'true'
        working-directory: live
        run: pnpm build
      - name: Playwright
        if: steps.changes.outputs.run == 'true'
        working-directory: live
        run: pnpm test:e2e
